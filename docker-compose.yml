volumes:
  pgdata:
  auth_db_data:  # Asegúrate de que este nombre sea EXACTO al que pusiste en db.auth
  asset_db_data: # Y este para el de assets
  financial_db_data: # Y este para el de financials
  booking_db_data: # Y este para el de booking
  engagement_db_data: # Y este para el de engagement
  accounting_db_data: # Y este para el de accounting
  payment_db_data: # Y este para el de payment
  redis_data:
